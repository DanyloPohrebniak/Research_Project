<style>

<button id="chatbot-btn" title="AI Learning Assistant">&#x1F4AC;</button>

<div id="chatbot-panel">
  <div id="chatbot-header">
    <div class="title">
      <div class="avatar">&#x1F916;</div>
      <div>
        <div>AI Learning Assistant</div>
        <div style="font-size:11px; opacity:0.8; font-weight:400;">Ask me about this course</div>
      </div>
    </div>
    <button id="chatbot-close">&#x2715;</button>
  </div>

  <div id="chatbot-messages">
    <div class="cb-msg assistant">
      Hello! I can help you understand course materials. What would you like to know?
    </div>
  </div>

  <div id="chatbot-input-area">
    <textarea id="chatbot-input" placeholder="Ask a question..." rows="1"></textarea>
    <button id="chatbot-send">&#x27A4;</button>
  </div>
</div>

<script>
(function() {
  const API_BASE = "/chatbot-api/api/v1";

  const USER_ID = (
    document.querySelector('meta[name="user-info"]')?.content ||
    window.user_info?.username ||
    "anonymous"
  );

  const COURSE_ID = (function() {
    const match = window.location.pathname.match(/course-v1:[^/]+\+[^/]+\+[^/]+/);
    return match ? match[0] : null;
  })();

  let sessionId = sessionStorage.getItem("chatbot_session") || null;

  const btn      = document.getElementById("chatbot-btn");
  const panel    = document.getElementById("chatbot-panel");
  const closeBtn = document.getElementById("chatbot-close");
  const messages = document.getElementById("chatbot-messages");
  const input    = document.getElementById("chatbot-input");
  const sendBtn  = document.getElementById("chatbot-send");

  btn.addEventListener("click", () => {
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) input.focus();
  });

  closeBtn.addEventListener("click", () => panel.classList.remove("open"));

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  sendBtn.addEventListener("click", sendMessage);

  function addMsg(role, text) {
    const div = document.createElement("div");
    div.className = `cb-msg ${role}`;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "cb-msg assistant cb-typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    addMsg("user", text);
    const typing = addTyping();

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          session_id: sessionId,
          user_id: USER_ID,
          course_id: COURSE_ID,
        }),
      });

      const data = await res.json();
      typing.remove();

      if (data.session_id) {
        sessionId = data.session_id;
        sessionStorage.setItem("chatbot_session", sessionId);
      }

      addMsg("assistant", data.reply || "Sorry, I could not process that.");
    } catch (err) {
      typing.remove();
      addMsg("assistant", "Connection error. Please try again.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
})();
</script>
